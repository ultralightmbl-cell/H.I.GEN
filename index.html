<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUD-GEN // SF Interface Generator</title>
    <meta name="description" content="High-fidelity Sci-Fi HUD Interface Generator.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;700&family=Inter:wght@300;400;700&family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="app">
        <canvas id="hud-canvas"></canvas>
        <header>
            <div class="logo">HUD-GEN<span>v1.0</span></div>
            <div class="status">SYSTEM: <span id="system-status">ACTIVE</span></div>
        </header>
        <nav class="controls">
            <button id="generate-btn" title="Generate New Graphic">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                <span>GENERATE</span>
            </button>
            <button id="download-btn" title="Download Full Screenshot">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span>DOWNLOAD</span>
            </button>
        </nav>
        <aside class="info">
            <div class="info-block"><label>PERSPECTIVE</label><div class="value">DRAG TO ROTATE</div></div>
            <div class="info-block"><label>RESOLUTION</label><div class="value">3840 x 2160</div></div>
        </aside>
        <footer><div class="copyright">© 2026 NERV / PUBLIC SAFETY BUREAU / SECTION 9</div></footer>
    </div>

    <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const ChromaticAberrationShader = {
    uniforms: { 'tDiffuse': { value: null }, 'amount': { value: 0.003 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float amount; varying vec2 vUv; void main() { vec4 col = texture2D(tDiffuse, vUv); col.r = texture2D(tDiffuse, vUv + vec2(amount, 0.0)).r; col.b = texture2D(tDiffuse, vUv - vec2(amount, 0.0)).b; gl_FragColor = col; }`
};

const HUDPostShader = {
    uniforms: { 'tDiffuse': { value: null }, 'time': { value: 0.0 }, 'scanlineCount': { value: 800.0 }, 'vignetteOpacity': { value: 0.6 }, 'noiseOpacity': { value: 0.04 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform float scanlineCount; uniform float vignetteOpacity; uniform float noiseOpacity; varying vec2 vUv; float rand(vec2 co) { return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); } void main() { vec4 col = texture2D(tDiffuse, vUv); float scanline = sin(vUv.y * scanlineCount) * 0.04; col.rgb -= scanline; float noise = (rand(vUv + time) - 0.5) * noiseOpacity; col.rgb += noise; float dist = distance(vUv, vec2(0.5, 0.5)); col.rgb *= smoothstep(0.8, 0.2, dist * vignetteOpacity); gl_FragColor = col; }`
};

class HUDAmbient {
    constructor() {
        this.isStarted = false;
        this.bgm = null;
    }
    init() {
        if (this.isStarted) return;
        this.isStarted = true;
        this.startBGM();
    }
    startBGM() {
        this.bgm = new Audio('bgm.mp3');
        this.bgm.loop = true;
        this.bgm.volume = 1.0;
        const play = () => { this.bgm.play().catch(() => {}); };
        document.addEventListener('click', () => { play(); }, { once: true });
        document.addEventListener('touchstart', () => { play(); }, { once: true });
    }
    resume() {
        if (this.bgm && this.bgm.paused) this.bgm.play().catch(e => {});
    }
}

class HUDGenerator {
    constructor() {
        this.canvas = document.getElementById('hud-canvas');
        if (!this.canvas) return;
        
        this.scene = new THREE.Scene();
        this.isMobile = window.innerWidth < 768;
        this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: !this.isMobile, preserveDrawingBuffer: true });
        this.colors = { cyan: 0x00f2ff, magenta: 0xff00ff, white: 0xffffff, blue: 0x0066ff, gold: 0xffd700, red: 0xff0000 };
        this.hudGroup = new THREE.Group();
        this.scene.add(this.hudGroup);
        this.ambient = new HUDAmbient();
        
        this.init();
        this.animate();
        this.setupEventListeners();
        this.ambient.init();
    }

    init() {
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setClearColor(0x05070a, 1.0);
        this.camera.position.z = this.isMobile ? 25 : 18;
        
        const renderPass = new RenderPass(this.scene, this.camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), this.isMobile ? 0.8 : 1.2, 0.4, 0.15); 
        const chromaPass = new ShaderPass(ChromaticAberrationShader);
        const hudPostPass = new ShaderPass(HUDPostShader);
        
        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(renderPass);
        this.composer.addPass(bloomPass);
        if (!this.isMobile) this.composer.addPass(chromaPass);
        this.composer.addPass(hudPostPass);
        
        this.hudPostPass = hudPostPass;
        this.controls = new OrbitControls(this.camera, this.canvas);
        this.controls.enableDamping = true;
        this.controls.enablePan = false;
        
        this.generate();
    }

    clearScene() { while(this.hudGroup.children.length > 0) { this.recursiveDispose(this.hudGroup.children[0]); this.hudGroup.remove(this.hudGroup.children[0]); } }
    recursiveDispose(obj) { if (obj.geometry) obj.geometry.dispose(); if (obj.material) { if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose()); else obj.material.dispose(); } if (obj.children) obj.children.forEach(c => this.recursiveDispose(c)); }

    generate() {
        this.clearScene();
        const palette = this.getRandomPalette();
        const hubCount = this.isMobile ? 2 : (2 + Math.floor(Math.random() * 2));
        const rangeX = this.isMobile ? 12 : 18;
        const rangeY = this.isMobile ? 20 : 12;

        document.getElementById('system-status').innerText = `BOOT_SEQUENCE_COMPLETE`;
        this.addProGrid(this.colors.blue, -50, 0.004);
        this.addLocalizedDust(palette);

        // Core Hubs
        for(let i=0; i<hubCount; i++) {
            const hx = (Math.random()-0.5) * rangeX;
            const hy = (Math.random()-0.5) * rangeY;
            const type = ['CORE', 'CORE', 'WAVE', 'PILLAR', 'RETICLE', 'HEX', 'GLOBE', 'CRYSTAL', 'HELIX', 'LATTICE', 'VORTEX'][Math.floor(Math.random()*11)];
            const size = (2.0 + Math.random() * 2.5) * (this.isMobile ? 0.8 : 1.0);
            const group = new THREE.Group(); group.userData.phaseOffset = Math.random()*Math.PI*2;
            switch(type) {
                case 'CORE': this.addHyperCore(hx, hy, palette, size, group); break;
                case 'WAVE': this.addHeroWaveMatrix(hx, hy, size * 3.5, size * 1.8, palette[0], group); break;
                case 'PILLAR': this.addHeroDataPillar(hx, hy, size, size * 2.5, palette[1], group); break;
                case 'RETICLE': this.addTacticalReticle(hx, hy, size, palette[2], group); break;
                case 'HEX': this.addHexGrid(hx, hy, size, palette[0], group); break;
                case 'GLOBE': this.addWireGlobe(hx, hy, size, palette[1], group); break;
                case 'CRYSTAL': this.addFractalCrystal(hx, hy, size, palette[0], group); break;
                case 'HELIX': this.addDataHelix(hx, hy, size, size*3, palette[1], group); break;
                case 'LATTICE': this.addNeuralLattice(hx, hy, size, palette[2], group); break;
                case 'VORTEX': this.addVortexEngine(hx, hy, size, palette[0], group); break;
            }
            this.hudGroup.add(group);
            if (!this.isMobile || Math.random() > 0.5) this.addCinematicTextParagraph(hx + size + 0.2, hy - size/2, palette[2]);
        }

        // Background Text
        const extraTextCount = this.isMobile ? 3 : 6;
        for(let i=0; i<extraTextCount; i++) {
            this.addCinematicTextParagraph((Math.random()-0.5)*rangeX, (Math.random()-0.5)*rangeY, palette[0]);
        }

        // --- RESTORE HERO WORDS (Foreground 3 Layers) ---
        const heroWords = ["HEURISTIC_CORE_09", "SYNAPTIC_VOID::2026", "RECURSIVE_GHOST_X", "PROTO_KERNEL_99", "NEURAL_SYNC_01", "KARDASHEV_SCALE", "EVENT_HORIZON_SCAN", "DYSTROPIAN_SYNAPSE"];
        const heroCount = this.isMobile ? 3 : 6;
        const tiers = this.isMobile ? [0.6, 0.4, 0.2] : [0.8, 0.5, 0.3];
        for(let i=0; i<heroCount; i++) {
            const word = heroWords[Math.floor(Math.random()*heroWords.length)];
            const tier = tiers[i % tiers.length];
            const hx = (Math.random()-0.5) * rangeX * 1.2;
            const hy = (Math.random()-0.5) * rangeY * 1.2;
            this.addHeroWord(hx, hy, palette[2], word, tier);
        }
    }

    addHeroWord(x, y, color, word, scaleMultiplier = 0.8) {
        const baseScale = (1.8 + Math.random() * 0.7) * (this.isMobile ? 0.6 : 1.0);
        const scale = baseScale * scaleMultiplier;
        this.addSharpText(this.hudGroup, color, x, y, scale, word, null, Math.random()*2.0);
        const lastSprite = this.hudGroup.children[this.hudGroup.children.length - 1];
        if (lastSprite && lastSprite.isSprite) {
            // Push to foreground based on scale multiplier (layering)
            lastSprite.position.z = 4 + scaleMultiplier * 6; 
            lastSprite.userData.isHeroWord = true;
            lastSprite.userData.baseOpacity = 0.35;
            lastSprite.userData.blinkSpeed = 0.4 + Math.random()*0.4;
        }
    }

    addHyperCore(x, y, palette, size, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const count = this.isMobile ? 2 : 4;
        for(let i=0; i<count; i++) {
            const r = size + i * 0.2; const arc = Math.PI * (0.3 + Math.random()*0.3);
            const mesh = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.08, this.isMobile ? 32 : 64, 1, Math.random()*Math.PI*2, arc), new THREE.MeshBasicMaterial({ color: palette[i%3], transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
            mesh.userData.rotateSpeed = (Math.random()-0.5) * 0.02; mesh.userData.baseOpacity = 0.8; group.add(mesh);
        }
        parent.add(group);
    }

    addHeroWaveMatrix(x, y, w, h, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, -1);
        const count = this.isMobile ? 2 : 4;
        for(let j=0; j<count; j++) {
            const points = []; const freq = 0.2 + Math.random() * 0.3;
            for(let i=0; i<=30; i++) { const px = (i/30-0.5)*w; const py = Math.sin(px*freq + j) * (h/4); points.push(new THREE.Vector3(px, py + (j - count/2)*(h/4), 0)); }
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3(points).getPoints(50)), new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.4 }));
            line.userData.baseOpacity = 0.4; group.add(line);
        }
        parent.add(group);
    }

    addHeroDataPillar(x, y, w, h, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const count = this.isMobile ? 6 : 12;
        for(let i=0; i<count; i++) {
            const py = (i/count-0.5)*h; this.addSharpText(group, color, 0, py, 0.1, (Math.random()*999).toFixed(0));
            const barW = Math.random() * w; const bar = new THREE.Mesh(new THREE.PlaneGeometry(barW, 0.03), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.6 }));
            bar.position.set(barW/2 + 0.2, py, 0); group.add(bar);
        }
        parent.add(group);
    }

    addTacticalReticle(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        group.add(new THREE.Mesh(new THREE.PlaneGeometry(size*2, 0.01), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 })));
        group.add(new THREE.Mesh(new THREE.PlaneGeometry(0.01, size*2), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 })));
        parent.add(group);
    }

    addHexGrid(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, -1);
        const r = this.isMobile ? 1 : 2;
        for(let q=-r; q<=r; q++) { for(let r_=-r; r_<=r; r_++) {
            const hex = new THREE.Mesh(new THREE.CircleGeometry(size/6, 6), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.1, wireframe: true }));
            hex.position.set(size/3 * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r_), size/3 * (3/2 * r_), 0); group.add(hex);
        }}
        parent.add(group);
    }

    addWireGlobe(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const globe = new THREE.Mesh(new THREE.SphereGeometry(size, 12, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.2, wireframe: true }));
        globe.userData.rotateSpeed = 0.01; group.add(globe);
        parent.add(group);
    }

    addFractalCrystal(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const geo = new THREE.IcosahedronGeometry(size, 0);
        const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3, wireframe: true }));
        mesh.userData.rotateSpeed = 0.01; group.add(mesh);
        parent.add(group);
    }

    addDataHelix(x, y, radius, height, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const points = []; const count = 60;
        for(let i=0; i<count; i++) {
            const a = (i/count) * Math.PI * 6; const py = (i/count-0.5)*height;
            points.push(new THREE.Vector3(Math.cos(a)*radius, py, Math.sin(a)*radius));
        }
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.4 }));
        line.userData.rotateSpeed = 0.03; group.add(line);
        parent.add(group);
    }

    addNeuralLattice(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const count = 20; const pts = [];
        for(let i=0; i<count; i++) pts.push(new THREE.Vector3((Math.random()-0.5)*size*2, (Math.random()-0.5)*size*2, (Math.random()-0.5)*size*2));
        pts.forEach((p, i) => { pts.slice(i+1).forEach(p2 => { if (p.distanceTo(p2) < size * 0.8) {
            group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p, p2]), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.2 })));
        }}); });
        group.userData.rotateSpeed = 0.005; parent.add(group);
    }

    addVortexEngine(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        for(let i=0; i<20; i++) {
            const r = size * (0.5 + Math.random()*0.5);
            const m = new THREE.Mesh(new THREE.PlaneGeometry(r, 0.02), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5 }));
            m.rotation.z = (i/20)*Math.PI*2; m.userData.rotateSpeed = 0.05; group.add(m);
        }
        parent.add(group);
    }

    addCinematicTextParagraph(x, y, color) {
        const quotes = ["NEURAL_SYNC_ESTABLISHED", "BUFFER_OVERFLOW_DETECTED", "GHOST_IN_THE_MACHINE", "RECURSIVE_VOID_01", "HEURISTIC_CORE_ONLINE"];
        const text = quotes[Math.floor(Math.random()*quotes.length)];
        const scale = (0.12 + Math.random() * 0.05) * (this.isMobile ? 0.7 : 1.0);
        this.addSharpText(this.hudGroup, color, x, y, scale, text, null, Math.random()*2.0);
    }

    getRandomPalette() {
        const sets = [[0x00f2ff, 0xff00ff, 0xffffff], [0xffd700, 0x00f2ff, 0xffffff], [0x00f2ff, 0x0066ff, 0xffffff]];
        return sets[Math.floor(Math.random() * sets.length)];
    }

    addSharpText(parent, color, x, y, scale, text, forcedWidth = null, delay = 0) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const fontSize = 80;
        ctx.font = `300 ${fontSize}px "Barlow Condensed"`;
        const metrics = ctx.measureText(text);
        const textWidth = Math.ceil(metrics.width) + 60;
        const textHeight = fontSize * 1.4;
        canvas.width = textWidth; canvas.height = textHeight;
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.0 });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(scale * (canvas.width / canvas.height), scale, 1);
        sprite.position.set(x, y, 0.2);
        sprite.userData = { baseOpacity: 0.9, fullText: text, currentChars: 0, typingStart: (Date.now() * 0.001) + delay, isTyping: true, color: color, fontSize: fontSize };
        parent.add(sprite);
    }

    addLocalizedDust(palette) {
        const count = this.isMobile ? 1200 : 3000;
        const pos = new Float32Array(count*3); for(let i=0; i<count; i++) { pos[i*3]=(Math.random()-0.5)*150; pos[i*3+1]=(Math.random()-0.5)*150; pos[i*3+2]=(Math.random()-0.5)*100; }
        const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: palette[0], size: 0.003, transparent: true, opacity: 0.05 }));
        pts.userData.baseOpacity = 0.05; this.hudGroup.add(pts);
    }

    addProGrid(color, z, opacity) {
        const g = new THREE.GridHelper(200, 80, color, color); g.material.opacity = opacity; g.material.transparent = true; g.rotation.x = Math.PI/2; g.position.z = z; g.userData.baseOpacity = opacity; this.hudGroup.add(g);
    }

    setupEventListeners() {
        window.addEventListener('resize', () => { 
            this.isMobile = window.innerWidth < 768;
            this.camera.aspect = window.innerWidth / window.innerHeight; 
            this.camera.position.z = this.isMobile ? 25 : 18;
            this.camera.updateProjectionMatrix(); 
            this.renderer.setSize(window.innerWidth, window.innerHeight); 
            this.composer.setSize(window.innerWidth, window.innerHeight); 
        });
        document.getElementById('generate-btn').addEventListener('click', () => { this.ambient.resume(); this.generate(); });
        document.getElementById('download-btn').addEventListener('click', () => this.exportPNG());
    }

    exportPNG() { this.composer.render(); const link = document.createElement('a'); link.download = `HUD_${Date.now()}.png`; link.href = this.canvas.toDataURL('image/png'); link.click(); }

    animate() {
        requestAnimationFrame(() => this.animate()); const time = Date.now() * 0.001; this.controls.update();
        if (this.hudPostPass) this.hudPostPass.uniforms.time.value = time;
        this.hudGroup.traverse((child) => {
            if (child.userData.rotateSpeed) child.rotation.z += child.userData.rotateSpeed;
            const ud = child.userData;
            if (ud.isTyping) {
                const elapsed = time - ud.typingStart;
                if (elapsed > 0) {
                    const charCount = Math.floor(elapsed * 45);
                    if (charCount > ud.currentChars) {
                        const textToShow = ud.fullText.substring(0, charCount);
                        const canvas = child.material.map.image; const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.font = `300 ${ud.fontSize}px "Barlow Condensed"`; ctx.fillStyle = '#' + new THREE.Color(ud.color).getHexString(); ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(textToShow, 20, canvas.height / 2); child.material.map.needsUpdate = true; ud.currentChars = charCount;
                    }
                }
            }
            if (child.material && ud.baseOpacity !== undefined) {
                const phase = child.parent && child.parent.userData.phaseOffset ? child.parent.userData.phaseOffset : 0;
                let p;
                if (ud.isHeroWord) {
                    p = 0.5 + Math.sin(time * (ud.blinkSpeed || 0.8)) * 0.5;
                } else {
                    p = 0.85 + Math.sin(time * 2 + child.id + phase) * 0.15;
                }
                if (Array.isArray(child.material)) child.material.forEach(m => m.opacity = ud.baseOpacity * p); else child.material.opacity = ud.baseOpacity * p;
            }
        });
        this.composer.render();
    }
}
window.addEventListener('load', () => { new HUDGenerator(); });
    </script>
</body>
</html>
