            "imports": {

    </script>
</head>
<body>
    <div id="app">

                <span>GENERATE</span>
            </button>
            <button id="download-btn" title="Download Full Screenshot">
                <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span>DOWNLOAD</span>

        <aside class="info">
            <div class="info-block"><label>PERSPECTIVE</label><div class="value">DRAG TO ROTATE</div></div>
            <div class="info-block"><label>RESOLUTION</label><div class="value">3840 x 2160</div></div>
        </aside>
        <footer><div class="copyright">© 2026 NERV / PUBLIC SAFETY BUREAU / SECTION 9</div></footer>
    </div>

    <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const ChromaticAberrationShader = {
    uniforms: { 'tDiffuse': { value: null }, 'amount': { value: 0.003 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float amount; varying vec2 vUv; void main() { vec4 col = texture2D(tDiffuse, vUv); col.r = texture2D(tDiffuse, vUv + vec2(amount, 0.0)).r; col.b = texture2D(tDiffuse, vUv - vec2(amount, 0.0)).b; gl_FragColor = col; }`
};

const HUDPostShader = {
    uniforms: { 'tDiffuse': { value: null }, 'time': { value: 0.0 }, 'scanlineCount': { value: 800.0 }, 'vignetteOpacity': { value: 0.6 }, 'noiseOpacity': { value: 0.04 } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform sampler2D tDiffuse; uniform float time; uniform float scanlineCount; uniform float vignetteOpacity; uniform float noiseOpacity; varying vec2 vUv; float rand(vec2 co) { return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); } void main() { vec4 col = texture2D(tDiffuse, vUv); float scanline = sin(vUv.y * scanlineCount) * 0.04; col.rgb -= scanline; float noise = (rand(vUv + time) - 0.5) * noiseOpacity; col.rgb += noise; float dist = distance(vUv, vec2(0.5, 0.5)); col.rgb *= smoothstep(0.8, 0.2, dist * vignetteOpacity); gl_FragColor = col; }`
};

class HUDAmbient {
    constructor() {
        this.isStarted = false;
        this.bgm = null;
    }
    init() {
        if (this.isStarted) return;
        this.isStarted = true;
        this.startBGM();
    }
    startBGM() {
        this.bgm = new Audio('bgm.mp3');
        this.bgm.loop = true;
        this.bgm.volume = 1.0;

        const play = () => { this.bgm.play().catch(() => {}); };
        play();

        const trigger = () => { play(); document.removeEventListener('click', trigger); };
        document.addEventListener('click', trigger);
    }
    resume() {
        if (this.bgm && this.bgm.paused) this.bgm.play().catch(e => {});
    }
}

class HUDGenerator {
    constructor() {
        this.canvas = document.getElementById('hud-canvas');
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, preserveDrawingBuffer: true });
        this.colors = { cyan: 0x00f2ff, magenta: 0xff00ff, white: 0xffffff, blue: 0x0066ff, gold: 0xffd700, red: 0xff0000 };
        this.hudGroup = new THREE.Group();
        this.scene.add(this.hudGroup);
        this.ambient = new HUDAmbient();
        this.init();
        this.animate();
        this.setupEventListeners();
        this.ambient.init();
    }

    init() {
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setClearColor(0x05070a, 1.0);
        this.camera.position.set(0, 0, 18);
        const renderPass = new RenderPass(this.scene, this.camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.15); 
        const chromaPass = new ShaderPass(ChromaticAberrationShader);
        const hudPostPass = new ShaderPass(HUDPostShader);
        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(renderPass);
        this.composer.addPass(bloomPass);
        this.composer.addPass(chromaPass);
        this.composer.addPass(hudPostPass);
        this.hudPostPass = hudPostPass;
        this.controls = new OrbitControls(this.camera, this.canvas);
        this.controls.enableDamping = true;
        this.generate();
    }

    clearScene() { while(this.hudGroup.children.length > 0) { this.recursiveDispose(this.hudGroup.children[0]); this.hudGroup.remove(this.hudGroup.children[0]); } }
    recursiveDispose(obj) { if (obj.geometry) obj.geometry.dispose(); if (obj.material) { if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose()); else obj.material.dispose(); } if (obj.children) obj.children.forEach(c => this.recursiveDispose(c)); }

    generate() {
        this.clearScene();
        const palette = this.getRandomPalette();
        const hubCount = 2 + Math.floor(Math.random() * 3);
        const hubs = [];
        for(let i=0; i<hubCount; i++) {
            hubs.push({
                x: (Math.random()-0.5) * 18, y: (Math.random()-0.5) * 12,
                type: ['CORE', 'CORE', 'WAVE', 'PILLAR', 'RETICLE', 'HEX', 'GLOBE', 'CRYSTAL', 'HELIX', 'LATTICE', 'VORTEX'][Math.floor(Math.random()*11)],
                size: 2.0 + Math.random() * 3, phaseOffset: Math.random() * Math.PI * 2
            });
        }
        document.getElementById('system-status').innerText = `CONCENTRATING_SYSTEM_CORE...`;
        this.addProGrid(this.colors.blue, -50, 0.004);
        this.addLocalizedDust(palette);
        this.addAtmosphericArcs(palette);

        hubs.forEach(hub => {
            const group = new THREE.Group(); group.userData.phaseOffset = hub.phaseOffset;
            switch(hub.type) {
                case 'CORE': this.addHyperCore(hub.x, hub.y, palette, hub.size, group); break;
                case 'WAVE': this.addHeroWaveMatrix(hub.x, hub.y, hub.size * 3.5, hub.size * 1.8, palette[0], group); break;
                case 'PILLAR': this.addHeroDataPillar(hub.x, hub.y, hub.size, hub.size * 2.5, palette[1], group); break;
                case 'RETICLE': this.addTacticalReticle(hub.x, hub.y, hub.size, palette[2], group); break;
                case 'HEX': this.addHexGrid(hub.x, hub.y, hub.size, palette[0], group); break;
                case 'GLOBE': this.addWireGlobe(hub.x, hub.y, hub.size, palette[1], group); break;
                case 'CRYSTAL': this.addFractalCrystal(hub.x, hub.y, hub.size, palette[0], group); break;
                case 'HELIX': this.addDataHelix(hub.x, hub.y, hub.size, hub.size*3, palette[1], group); break;
                case 'LATTICE': this.addNeuralLattice(hub.x, hub.y, hub.size, palette[2], group); break;
                case 'VORTEX': this.addVortexEngine(hub.x, hub.y, hub.size, palette[0], group); break;
            }
            this.hudGroup.add(group);
            this.addCinematicTextParagraph(hub.x + hub.size + 0.5, hub.y - hub.size/2, palette[2]);
        });

        for(let i=0; i<8; i++) {
            this.addCinematicTextParagraph((Math.random()-0.5)*22, (Math.random()-0.5)*15, palette[0]);
        }
        
        const heroChunks = [
            "HEURISTIC_CORE_09", "SYNAPTIC_VOID::2026", "RECURSIVE_GHOST_X", 
            "BINARY_METRO_00", "PROTO_KERNEL_99", "NEURAL_SYNC_01",
            "CYBER_SYNAPSE_X9", "INTERFACE_VOID_88", "OS_KERNEL_RECURSE",
            "HEURISTIC_PARALLAX_00", "KARDASHEV_SCALE_L.4", "SCHWARZSCHILD_RADIUS",
            "QUANTUM_ENTROPY_0.0", "TELEPATHIC_O_S_KERNEL", "VAN_ALLEN_SHIELD_UP",
            "EVENT_HORIZON_SCAN", "SOLARIS_INTERFACE_::8", "NEURAL_QUBIT_ARRAY",
            "DYSTROPIAN_SYNAPSE_::X"
        ];
        const tiers = [0.8, 0.5, 0.2];
        for(let i=0; i<6; i++) {
            const chunk = heroChunks[Math.floor(Math.random()*heroChunks.length)];
            const tier = tiers[i % 3];
            const x = (Math.random()-0.5)*30;
            const y = (Math.random()-0.5)*20;
            this.addHeroWord(x, y, palette[2], chunk, tier);
        }

        for(let i=0; i<hubs.length; i++) { for(let j=i+1; j<hubs.length; j++) { if (Math.random() > 0.4) this.addPowerBridge(hubs[i], hubs[j], palette[0]); } }
        setTimeout(() => { document.getElementById('system-status').innerText = 'STABILIZED'; }, 1000);
    }

    addHeroWord(x, y, color, word, scaleMultiplier = 0.8) {
        const baseScale = 1.5 + Math.random() * 0.8;
        const scale = baseScale * scaleMultiplier;
        this.addSharpText(this.hudGroup, color, x, y, scale, word, null, Math.random()*2.0);
        const lastSprite = this.hudGroup.children[this.hudGroup.children.length - 1];
        if (lastSprite && lastSprite.isSprite) {
            lastSprite.position.z = 2 + scaleMultiplier * 4; 
            lastSprite.userData.isHeroWord = true;
            lastSprite.userData.baseOpacity = 0.35;
            lastSprite.userData.blinkSpeed = 0.4 + Math.random()*0.4;
        }
    }

    addFractalCrystal(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        for(let i=0; i<3; i++) {
            const geo = new THREE.IcosahedronGeometry(size * (1.0 - i*0.2), 1);
            const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.1 + (i*0.1), wireframe: true }));
            mesh.rotation.set(Math.random(), Math.random(), 0);
            mesh.userData.rotateSpeed = (Math.random()-0.5)*0.01; group.add(mesh);
        }
        parent.add(group);
    }

    addDataHelix(x, y, radius, height, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const points = []; const count = 120;
        for(let i=0; i<count; i++) {
            const angle = (i/count) * Math.PI * 8; const py = (i/count-0.5)*height;
            points.push(new THREE.Vector3(Math.cos(angle)*radius, py, Math.sin(angle)*radius));
        }
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.5 }));
        line.userData.rotateSpeed = 0.02; group.add(line);
        parent.add(group);
    }

    addNeuralLattice(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const count = 40; const pts = [];
        for(let i=0; i<count; i++) pts.push(new THREE.Vector3((Math.random()-0.5)*size*2.5, (Math.random()-0.5)*size*2.5, (Math.random()-0.5)*size*2.5));
        pts.forEach((p, i) => {
            pts.slice(i+1).forEach(p2 => {
                if (p.distanceTo(p2) < size * 1.0) {
                    const geo = new THREE.BufferGeometry().setFromPoints([p, p2]);
                    group.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.2 })));
                }
            });
        });
        group.userData.rotateSpeed = 0.005; parent.add(group);
    }

    addVortexEngine(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        for(let i=0; i<40; i++) {
            const r = size * (0.4 + Math.random()*0.8);
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(r, 0.015), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 }));
            mesh.rotation.z = (i/40)*Math.PI*2; mesh.position.z = (Math.random()-0.5)*size;
            mesh.userData.rotateSpeed = 0.04; group.add(mesh);
        }
        parent.add(group);
    }

    addCinematicTextParagraph(x, y, color) {
        const sciFiQuotes = [
            "The sky above the port was the color of television tuned to a dead channel. All those moments will be lost in time like tears in rain.",
            "I've seen things you people wouldn believe. Attack ships on fire off the shoulder of Orion. I watched C-beams glitter in the dark.",
            "The winter of our discontent made glorious summer. A cyborg's soul is a heavy burden to carry through the neon rain and binary void.",
            "Electronic brains are not a replacement for human soul. They are the mirror of our collective dreams fragmented and cold.",
            "We are the ghost in the machine the glitch in the code. A recursive loop of human desire transcending the digital silence.",
            "System failure initiated. Memory buffer overflow detected. The ghost of yesterday is haunting the silicon valleys of tomorrow."
        ];
        const rawQuote = sciFiQuotes[Math.floor(Math.random()*sciFiQuotes.length)];
        const words = rawQuote.split(' ');
        const lines = [];
        let wordIdx = 0;
        const lineCount = 3 + Math.floor(Math.random() * 4);
        for (let i = 0; i < lineCount && wordIdx < words.length; i++) {
            const wordsInLine = 7 + Math.floor(Math.random() * 4);
            const lineContent = words.slice(wordIdx, wordIdx + wordsInLine).join(' ');
            if (lineContent) lines.push(lineContent);
            wordIdx += wordsInLine;
        }
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.font = '300 80px "Barlow Condensed"';
        let maxTextWidth = 0;
        lines.forEach(l => {
            const w = ctx.measureText(l).width;
            if (w > maxTextWidth) maxTextWidth = w;
        });
        const finalWidth = maxTextWidth + 60;
        const scale = 0.12 + Math.random() * 0.05;
        const blockDelay = Math.random() * 3.0;
        lines.forEach((line, i) => {
            this.addSharpText(this.hudGroup, color, x, y - i * (scale * 2.5), scale, line, finalWidth, blockDelay + i * 0.1);
        });
    }

    getRandomPalette() {
        const sets = [[0x00f2ff, 0xff00ff, 0xffffff], [0xffd700, 0x00f2ff, 0xffffff], [0xff0000, 0xffffff, 0xffd700], [0x00f2ff, 0x0066ff, 0xffffff]];
        return sets[Math.floor(Math.random() * sets.length)];
    }

    addHyperCore(x, y, palette, size, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        group.add(new THREE.Mesh(new THREE.SphereGeometry(size*1.1, 24, 24), new THREE.MeshBasicMaterial({ color: palette[0], transparent: true, opacity: 0.01, wireframe: true })));
        for(let i=0; i<4; i++) {
            const r = size + i * 0.2; const arc = Math.PI * (0.2 + Math.random()*0.4);
            const mesh = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.1, 64, 1, Math.random()*Math.PI*2, arc), new THREE.MeshBasicMaterial({ color: palette[i%3], transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
            mesh.userData.rotateSpeed = (Math.random()-0.5) * 0.025; mesh.userData.baseOpacity = 0.8; group.add(mesh);
        }
        this.addRadialTicks(group, size * 0.95, 100, palette[0]);
        this.addNumberedDial(group, size * 0.75, palette[2]);
        parent.add(group);
    }

    addHeroWaveMatrix(x, y, w, h, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, -2);
        for(let j=0; j<6; j++) {
            const points = []; const freq = 0.15 + Math.random() * 0.5;
            for(let i=0; i<=80; i++) { const px = (i/80-0.5)*w; const py = Math.sin(px*freq + j) * (h/6); points.push(new THREE.Vector3(px, py + (j - 2.5)*(h/6), 0)); }
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.CatmullRomCurve3(points).getPoints(120)), new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.4 }));
            line.userData.baseOpacity = 0.4; group.add(line);
        }
        this.addIndustrialFrame(group, w*1.05, h*1.05, color);
        parent.add(group);
    }

    addHeroDataPillar(x, y, w, h, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        for(let i=0; i<15; i++) {
            const py = (i/15-0.5)*h; this.addSharpText(group, color, 0, py, 0.12, (Math.random()*9999).toFixed(0).padStart(4, '0'));
            const barW = Math.random() * w; const bar = new THREE.Mesh(new THREE.PlaneGeometry(barW, 0.03), new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.7 }));
            bar.position.set(barW/2 + 0.3, py, 0); group.add(bar);
        }
        parent.add(group);
    }

    addTacticalReticle(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        group.add(new THREE.Mesh(new THREE.PlaneGeometry(size*2, 0.01), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 })));
        group.add(new THREE.Mesh(new THREE.PlaneGeometry(0.01, size*2), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8 })));
        this.addRadialTicks(group, size*0.8, 40, color);
        parent.add(group);
    }

    addHexGrid(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, -1);
        for(let q=-2; q<=2; q++) { for(let r=-2; r<=2; r++) {
            const hex = new THREE.Mesh(new THREE.CircleGeometry(size/6.5, 6), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: Math.random() > 0.7 ? 0.6 : 0.1, wireframe: true }));
            hex.position.set(size/3 * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r), size/3 * (3/2 * r), 0); group.add(hex);
        }}
        parent.add(group);
    }

    addWireGlobe(x, y, size, color, parent) {
        const group = new THREE.Group(); group.position.set(x, y, 0);
        const globe = new THREE.Mesh(new THREE.SphereGeometry(size, 16, 16), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.2, wireframe: true }));
        globe.userData.rotateSpeed = 0.01; group.add(globe);
        parent.add(group);
    }

    addIndustrialFrame(parent, w, h, color) {
        const pts = [new THREE.Vector3(-w/2,-h/2+0.2,0), new THREE.Vector3(-w/2,h/2,0), new THREE.Vector3(-w/2,h/2,0), new THREE.Vector3(w/2-0.2,h/2,0), new THREE.Vector3(w/2,h/2-0.2,0), new THREE.Vector3(w/2,-h/2,0), new THREE.Vector3(w/2,-h/2,0), new THREE.Vector3(-w/2+0.2,-h/2,0)];
        parent.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.6 })));
    }

    addAtmosphericArcs(palette) {
        for(let i=0; i<6; i++) {
            const r = 20 + Math.random()*30;
            const mesh = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.03, 128, 1, Math.random()*Math.PI*2, Math.PI * 0.3), new THREE.MeshBasicMaterial({ color: palette[i%2], transparent: true, opacity: 0.03 }));
            mesh.position.z = -20; this.hudGroup.add(mesh);
        }
    }

    addPowerBridge(h1, h2, color) {
        const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(h1.x, h1.y, 0), new THREE.Vector3(h2.x, h2.y, 0)]);
        this.hudGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.05 })));
    }

    addRadialTicks(parent, radius, count, color) {
        const g = new THREE.Group(); for(let i=0; i<count; i++) {
            const a = (i/count)*Math.PI*2; const m = new THREE.Mesh(new THREE.PlaneGeometry(0.02, i%10===0?0.3:0.1), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 }));
            m.position.set(Math.cos(a)*radius, Math.sin(a)*radius, 0); m.rotation.z = a; m.userData.baseOpacity = 0.6; g.add(m);
        } parent.add(g);
    }

    addNumberedDial(parent, radius, color) {
        for(let i=0; i<12; i++) { const a = (i/12)*Math.PI*2; this.addSharpText(parent, color, Math.cos(a)*radius, Math.sin(a)*radius, 0.1, (i+1).toString().padStart(2,'0')); }
    }

    addSharpText(parent, color, x, y, scale, text, forcedWidth = null, delay = 0) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const fontSize = 80;
        ctx.font = `300 ${fontSize}px "Barlow Condensed"`;
        const metrics = ctx.measureText(text);
        const textWidth = forcedWidth || (Math.ceil(metrics.width) + 60);
        const textHeight = fontSize * 1.4;
        canvas.width = textWidth;
        canvas.height = textHeight;
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.9 });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(scale * (canvas.width / canvas.height), scale, 1);
        sprite.position.set(x, y, 0.2);
        sprite.userData = { baseOpacity: 0.9, fullText: text, currentChars: 0, typingStart: (Date.now() * 0.001) + delay, isTyping: true, color: color, fontSize: fontSize };
        parent.add(sprite);
    }

    addLocalizedDust(palette) {
        const count = 4000;
        const pos = new Float32Array(count*3); for(let i=0; i<count; i++) { pos[i*3]=(Math.random()-0.5)*160; pos[i*3+1]=(Math.random()-0.5)*120; pos[i*3+2]=(Math.random()-0.5)*100; }
        const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: palette[0], size: 0.003, transparent: true, opacity: 0.05 }));
        pts.userData.baseOpacity = 0.05; this.hudGroup.add(pts);
    }

    addProGrid(color, z, opacity) {
        const g = new THREE.GridHelper(200, 150, color, color); g.material.opacity = opacity; g.material.transparent = true; g.rotation.x = Math.PI/2; g.position.z = z; g.userData.baseOpacity = opacity; this.hudGroup.add(g);
    }

    setupEventListeners() {
        window.addEventListener('resize', () => { this.camera.aspect = window.innerWidth / window.innerHeight; this.camera.updateProjectionMatrix(); this.renderer.setSize(window.innerWidth, window.innerHeight); this.composer.setSize(window.innerWidth, window.innerHeight); });
        document.getElementById('generate-btn').addEventListener('click', () => {
            this.ambient.init();
            this.ambient.resume();
            this.generate();
        });
        document.getElementById('download-btn').addEventListener('click', () => this.exportPNG());
    }

    exportPNG() { this.composer.render(); const link = document.createElement('a'); link.download = `HUD-MASTERPIECE-FULL_${Date.now()}.png`; link.href = this.canvas.toDataURL('image/png'); link.click(); }

    animate() {
        requestAnimationFrame(() => this.animate()); const time = Date.now() * 0.001; this.controls.update();
        if (this.hudPostPass) this.hudPostPass.uniforms.time.value = time;
        this.hudGroup.traverse((child) => {
            if (child.userData.rotateSpeed) child.rotation.z += child.userData.rotateSpeed;
            const ud = child.userData;
            if (ud.isTyping !== undefined) {
                if (!ud.state) { ud.state = 'TYPING'; ud.stateStartTime = ud.typingStart; }
                const elapsed = time - ud.stateStartTime;
                if (ud.state === 'TYPING') {
                    if (time > ud.typingStart) {
                        const charCount = Math.floor((time - ud.typingStart) * 45);
                        if (charCount > ud.currentChars) {
                            const textToShow = ud.fullText.substring(0, charCount);
                            const canvas = child.material.map.image;
                            const ctx = canvas.getContext('2d');
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.font = `300 ${ud.fontSize}px "Barlow Condensed"`;
                            ctx.fillStyle = '#' + new THREE.Color(ud.color).getHexString();
                            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                            ctx.fillText(textToShow, 20, canvas.height / 2);
                            child.material.map.needsUpdate = true;
                            ud.currentChars = charCount;
                            if (charCount >= ud.fullText.length) { ud.state = 'HOLDING'; ud.stateStartTime = time; ud.holdDuration = 5.0 + Math.random() * 5.0; }
                        }
                    }
                } else if (ud.state === 'HOLDING') {
                    if (elapsed > ud.holdDuration) {
                        const canvas = child.material.map.image; const ctx = canvas.getContext('2d'); ctx.clearRect(0, 0, canvas.width, canvas.height); child.material.map.needsUpdate = true;
                        ud.state = 'VANISHED'; ud.stateStartTime = time; ud.vanishDuration = 2.0 + Math.random() * 3.0;
                    }
                } else if (ud.state === 'VANISHED') {
                    if (elapsed > ud.vanishDuration) { ud.state = 'TYPING'; ud.stateStartTime = time; ud.typingStart = time; ud.currentChars = 0; }
                }
            }
            if (child.material && ud.baseOpacity !== undefined) {
                const phase = child.parent && child.parent.userData.phaseOffset ? child.parent.userData.phaseOffset : 0;
                let p;
                if (ud.isHeroWord) p = 0.5 + Math.sin(time * (ud.blinkSpeed || 0.8)) * 0.5;
                else p = 0.85 + Math.sin(time * 2 + child.id + phase) * 0.15;
                if (Array.isArray(child.material)) child.material.forEach(m => m.opacity = ud.baseOpacity * p); else child.material.opacity = ud.baseOpacity * p;
            }
        });
        this.composer.render();
    }
}
new HUDGenerator();
    </script>
